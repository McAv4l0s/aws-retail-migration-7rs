AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cost-conscious AWS foundation for the retail migration portfolio. Creates a
  VPC, public and isolated private subnets across two Availability Zones,
  routing, optional VPC Flow Logs, a workload security group, and an encrypted
  evidence bucket. No NAT Gateway or compute resources are created.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project configuration
        Parameters:
          - ProjectName
          - Environment
      - Label:
          default: Network configuration
        Parameters:
          - VpcCidr
          - PublicSubnetACidr
          - PublicSubnetBCidr
          - PrivateSubnetACidr
          - PrivateSubnetBCidr
      - Label:
          default: Logging configuration
        Parameters:
          - EnableVpcFlowLogs
          - LogRetentionDays
    ParameterLabels:
      EnableVpcFlowLogs:
        default: Enable VPC Flow Logs?

Parameters:
  ProjectName:
    Type: String
    Default: retail-migration-7rs
    Description: Lowercase identifier used in names and cost-allocation tags.
    AllowedPattern: "^[a-z][a-z0-9-]{2,30}$"
    ConstraintDescription: Use 3-31 lowercase letters, numbers, or hyphens.

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  VpcCidr:
    Type: String
    Default: 10.40.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  PublicSubnetACidr:
    Type: String
    Default: 10.40.1.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  PublicSubnetBCidr:
    Type: String
    Default: 10.40.2.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  PrivateSubnetACidr:
    Type: String
    Default: 10.40.10.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  PrivateSubnetBCidr:
    Type: String
    Default: 10.40.20.0/24
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  EnableVpcFlowLogs:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 180
      - 365

Conditions:
  FlowLogsEnabled: !Equals [!Ref EnableVpcFlowLogs, "true"]

Resources:
  MigrationVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref MigrationVpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Ref PublicSubnetACidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-a"
        - Key: Tier
          Value: public

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-b"
        - Key: Tier
          Value: public

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Ref PrivateSubnetACidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-a"
        - Key: Tier
          Value: private-isolated

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: !Ref AWS::Region
      CidrBlock: !Ref PrivateSubnetBCidr
      MapPublicIpOnLaunch: false
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-b"
        - Key: Tier
          Value: private-isolated

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-a-rt"

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-private-b-rt"

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      SubnetId: !Ref PrivateSubnetB

  WorkloadSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Default workload group with no inbound rules
      SecurityGroupEgress:
        - Description: Permit outbound traffic; restrict per workload before production
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      VpcId: !Ref MigrationVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-workload-sg"

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/portfolio/${ProjectName}/${Environment}/vpc-flow-logs"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  FlowLogsRole:
    Type: AWS::IAM::Role
    Condition: FlowLogsEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - vpc-flow-logs.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: WriteVpcFlowLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${MigrationLogGroup.Arn}:*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Condition: FlowLogsEnabled
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref MigrationLogGroup
      MaxAggregationInterval: 600
      ResourceId: !Ref MigrationVpc
      ResourceType: VPC
      TrafficType: ALL

  EvidenceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: internal
      VersioningConfiguration:
        Status: Enabled

Outputs:
  VpcId:
    Description: VPC created for the migration laboratory.
    Value: !Ref MigrationVpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs.
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]

  PrivateSubnetIds:
    Description: Comma-separated isolated private subnet IDs.
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]

  WorkloadSecurityGroupId:
    Description: Security group with no inbound rules.
    Value: !GetAtt WorkloadSecurityGroup.GroupId

  EvidenceBucketName:
    Description: Retained encrypted bucket for migration evidence.
    Value: !Ref EvidenceBucket

  VpcFlowLogsStatus:
    Description: Whether VPC Flow Logs were requested.
    Value: !If [FlowLogsEnabled, enabled, disabled]
